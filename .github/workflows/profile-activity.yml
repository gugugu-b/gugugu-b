name: Refresh animated contribution heatmap

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render animations from GitHub activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/profile-venv
          /tmp/profile-venv/bin/pip install Pillow==12.3.0
          /tmp/profile-venv/bin/python scripts/build_activity.py --fetch
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json assets/contribution-heatmap.gif assets/contribution-heatmap.png assets/operator-hotspots.gif assets/operator-hotspots.png
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh animated profile activity'
            git push
          fi
